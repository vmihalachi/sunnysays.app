<!doctype html>
<html lang="{{locale.lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>{{notFound.metaTitle}}</title>
    <meta name="theme-color" content="#FFF8E7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F1A14" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="masthead">
      <nav class="nav" aria-label="{{nav.ariaLabel}}">
        <a class="wordmark" href="/" aria-label="{{nav.wordmarkAria}}">{{nav.wordmark}}</a>
      </nav>
    </header>
    <main id="main">
      <section class="get" aria-labelledby="not-found-title">
        <img class="get-sunny" src="/sunny.svg" width="120" height="132" alt="" />
        <h1 id="not-found-title">{{notFound.title}}</h1>
        <p>{{notFound.body}}</p>
        <a class="button button-big" href="/">{{notFound.home}}</a>
      </section>
    </main>
  </body>
</html>
