# Checks and builds every push and pull request; main deploys dist/ (with the _headers file that carries
# the CSP) to the sunnysays-landing Worker (wrangler.json), served on sunnysays.app.
name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: ${{ github.event_name == 'pull_request' && 'Check' || 'Check and deploy' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vp check
      - run: npm run build
      # Dead links, one-way hreflang, a page missing in a language, a legal page that never names a store or
      # platform (laching-landing check, offline against dist/): any problem stops the deploy.
      - run: npx laching-landing check
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy
